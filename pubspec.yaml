name: driveresq_app
description: "DriveResQ — Roadside assistance app connecting drivers with mechanics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.10

  # Notifications
  flutter_local_notifications: ^21.0.0

  # State Management
  get: ^4.7.3

  # UI
  google_fonts: ^7.0.0
  shimmer: ^3.0.0
  pinput: ^6.0.1
  cached_network_image: ^3.4.1
  flashy_flushbar: ^1.4.1

  # Location & Maps
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.14.0

  # Media & Files
  image_picker: ^1.2.1
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^12.0.1

  # Audio (Voice Messages)
  record: ^6.2.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1

  # Utilities
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  google_nav_bar: 5.0.7
  iconsax: 0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/Black and White Simple Mechanic Logo (2).png"
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icon/Black and White Simple Mechanic Logo (2).png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/

